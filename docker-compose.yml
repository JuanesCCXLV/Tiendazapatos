services:

  clientes-db:
    image: postgres:18
    container_name: clientes-db
    environment:
      POSTGRES_DB: tienda_clientes
      POSTGRES_USER: clientes_app
      POSTGRES_PASSWORD: clientes123
    volumes:
      - clientes_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientes_app -d tienda_clientes"]
      interval: 5s
      timeout: 5s
      retries: 10

  clientes-service:
    build: ./clientes-service
    container_name: clientes-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg2://clientes_app:clientes123@clientes-db:5432/tienda_clientes
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
    depends_on:
      clientes-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  zapatos-db:
    image: postgres:18
    container_name: zapatos-db
    environment:
      POSTGRES_DB: tienda_zapatos
      POSTGRES_USER: zapatos_app
      POSTGRES_PASSWORD: zapatos123
    volumes:
      - zapatos_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapatos_app -d tienda_zapatos"]
      interval: 5s
      timeout: 5s
      retries: 10

  zapatos-service:
    build: ./zapatos-service
    container_name: zapatos-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg2://zapatos_app:zapatos123@zapatos-db:5432/tienda_zapatos
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
    depends_on:
      zapatos-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ventas-db:
    image: mongo:6
    container_name: ventas-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ventas_app
      MONGO_INITDB_ROOT_PASSWORD: ventas123
      MONGO_INITDB_DATABASE: tienda_ventas
    volumes:
      - ventas_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  ventas-service:
    build: ./ventas-service
    container_name: ventas-service
    ports:
      - "8003:8003"
    environment:
      MONGO_URL: mongodb://ventas_app:ventas123@ventas-db:27017/tienda_ventas?authSource=admin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
    depends_on:
      ventas-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  clientes_data:
  zapatos_data:
  ventas_data:
  rabbitmq_data:
